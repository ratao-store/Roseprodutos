<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel Admin - Rose Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Painel Admin - Rose Produtos</h1>
  </header>

  <div class="container">
    <!-- Tela de Login Admin -->
    <div id="admin-login-box" class="admin-card">
      <h2>Acesso Administrativo</h2>
      <form id="form-login-admin">
        <div class="form-group"><input type="email" id="admin-email" placeholder="E-mail Admin" required></div>
        <div class="form-group"><input type="password" id="admin-senha" placeholder="Senha Secreta" required></div>
        <button type="submit" class="btn btn-rosa">Acessar Painel</button>
      </form>
    </div>

    <!-- Conteúdo do Painel -->
    <div id="admin-panel" class="hidden">
      
      <!-- Cadastro / Edição de Produto -->
      <div class="admin-card">
        <h2 id="form-title">Cadastrar Produto</h2>
        <form id="form-produto">
          <input type="hidden" id="prod-id">
          <div class="form-group"><input type="text" id="prod-nome" placeholder="Nome do Produto" required></div>
          <div class="form-group"><input type="number" step="0.01" id="prod-preco" placeholder="Preço (Ex: 49.90)" required></div>
          <div class="form-group"><input type="url" id="prod-imagem" placeholder="URL da Imagem" required></div>
          <button type="submit" class="btn btn-rosa" id="btn-salvar">Salvar Produto</button>
          <button type="button" class="btn btn-danger hidden" id="btn-cancelar" onclick="limparFormulario()">Cancelar Edição</button>
        </form>
      </div>

      <!-- Gerenciador de Produtos -->
      <div class="admin-card">
        <h2>Gerenciar Produtos e Reservas</h2>
        <div id="admin-produtos-list" style="margin-top: 1rem;"></div>
      </div>

      <!-- Gerenciador de Banimentos -->
      <div class="admin-card">
        <h2>Banir Conta de Usuário</h2>
        <div class="form-group">
          <input type="text" id="ban-uid" placeholder="Cole o UID do Usuário que deseja banir">
        </div>
        <button onclick="banirUsuario()" class="btn btn-danger">Banir Usuário</button>
      </div>

    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
