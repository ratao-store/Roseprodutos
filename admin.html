<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin - Rose Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">🌸 Painel Admin</div>
      <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Ver Loja</a>
    </div>
  </header>

  <main style="max-width: 800px; margin: 30px auto; padding: 0 20px;">
    
    <!-- Caixa de Acesso -->
    <div class="login-card" id="admin-login-box" style="max-width: 100%; margin-bottom: 30px;">
      <h2>Acesso Administrativo</h2>
      <form id="form-admin-login">
        <div class="input-group">
          <span class="icon">👤</span>
          <input type="email" placeholder="E-mail do Administrador" required>
        </div>
        <div class="input-group">
          <span class="icon">🔒</span>
          <input type="password" placeholder="Senha" required>
        </div>
        <button type="submit" class="btn-login-pink">Acessar Painel</button>
      </form>
    </div>

    <!-- Secções de Gestão (Ocultas até fazer login) -->
    <div id="admin-content" style="display: none;">
      
      <!-- Cadastrar Produto -->
      <div class="login-card" style="max-width: 100%; margin-bottom: 30px;">
        <h2>Cadastrar Novo Produto</h2>
        <form id="form-produto">
          <div class="input-group">
            <input type="text" id="prod-nome" placeholder="Nome do Produto (ex: Natura Homem)" required>
          </div>
          <div class="input-group">
            <input type="number" step="0.01" id="prod-preco" placeholder="Preço (ex: 240.99)" required>
          </div>
          <div class="input-group">
            <input type="text" id="prod-img" placeholder="URL da Imagem do Produto" required>
          </div>
          <button type="submit" class="btn-login-pink">Salvar Produto</button>
        </form>
      </div>

      <!-- Gerendar Produtos -->
      <div class="login-card" style="max-width: 100%;">
        <h2>Produtos e Reservas</h2>
        <div id="admin-produtos-lista">
          <!-- Lista carregada via JS -->
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
