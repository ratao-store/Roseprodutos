<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose Produtos - Cosméticos e Perfumaria</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo">🌸 Rose Produtos</div>
      <a href="admin.html" style="color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem;">Área Admin</a>
    </div>
  </header>

  <main style="max-width: 1000px; margin: 20px auto; padding: 0 15px;">
    <!-- Banner de Boas-Vindas -->
    <div style="background: white; border-radius: 16px; padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px;">
      <h1 style="color: var(--primary); margin-bottom: 8px;">Cosméticos e Perfumaria ✨</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Nossos Produtos Natura a pronta entrega com reservas fáceis.</p>
    </div>

    <!-- Lista de Produtos (Grelha) -->
    <h2 style="color: var(--text-dark); margin-bottom: 15px;">Produtos Disponíveis</h2>
    <div id="grid-produtos" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px;">
      <!-- Carregado via js/app.js -->
      <p style="color: var(--text-muted);">A carregar produtos...</p>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
