<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rose Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="header-container">
      <div class="logo">🌸 Rose Produtos</div>
    </div>
  </header>

  <!-- Cartão de Login Rosa -->
  <div class="login-card">
    <h2>Acessar Conta</h2>
    
    <form id="form-login">
      <!-- Campo Nome / E-mail -->
      <div class="input-group">
        <span class="icon">👤</span>
        <input type="text" placeholder="Nome ou E-mail" required>
      </div>

      <!-- Campo Senha -->
      <div class="input-group">
        <span class="icon">🔒</span>
        <input type="password" placeholder="Senha" required>
      </div>

      <div class="forgot-pass">
        <a href="#">Esqueceu sua senha?</a>
      </div>

      <!-- Botão Principal de Login -->
      <button type="submit" class="btn-login-pink">Login</button>
    </form>

    <div class="divider">
      <span>Ou</span>
    </div>

    <!-- Botão Google -->
    <button id="btn-google-login" class="btn-google">
      <svg class="google-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Acesse usando google
    </button>
  </div>

  <!-- Banner do Site -->
  <section class="hero">
    <div class="hero-card">
      <h1>Cosméticos e Perfumaria ✨</h1>
      <p>Nossos Produtos Natura a pronta entrega com reservas fáceis.</p>
    </div>
  </section>

  <!-- Montra de Produtos -->
  <h2 class="section-title">Produtos Disponíveis</h2>
  <main id="produtos-container" class="products-grid">
    <!-- Os produtos carregam aqui via JS -->
  </main>

  <!-- Botão Flutuante de Carrinho -->
  <button id="btn-carrinho" class="floating-cart">
    🛒 Reservas (<span id="cart-count">0</span>)
  </button>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
